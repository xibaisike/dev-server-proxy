[package]
name = "dev-server-proxy"
version = "1.0.0"
edition = "2021"
authors = ["xibaisike"]
description = "A lightweight HTTP proxy server for web development with nginx-like location matching"
license = "MIT"
repository = "https://github.com/xibaisike/dev-server-proxy"

[[bin]]
name = "dsp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
hyper = { version = "1.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
http = "1.1"
http-body-util = "0.1"
bytes = "1.5"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
